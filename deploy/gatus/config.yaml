# ============================================================================
# CurrentMusic 服务状态页 —— Gatus 监控配置
# ----------------------------------------------------------------------------
# 框架：Gatus v5.38.0（Apache-2.0，https://github.com/TwiN/gatus）
# 二进制：/opt/gatus/gatus（源码构建，CGO 关闭；前端已按 /status/ 前缀重新
#   打包并内嵌——vue publicPath + API 路径补丁，重构建步骤见 deploy/README.md）
# 运行数据：/opt/gatus/data/gatus.db（sqlite，勿提交、勿删除）
# 对外访问：https://music.20110208.xyz/status/（与 /app、/api-docs/ 同域路径惯例，
#   nginx location /status/ 剥前缀反代 127.0.0.1:8080）；
#   备用直连入口 http://45.207.204.178:39530/status/（Cloudflare 故障时应急，
#   见 /www/server/panel/vhost/nginx/status-music-39530.conf）
#
# 分层策略：
#   · 公网入口走 https://music.20110208.xyz/**（覆盖 Cloudflare → nginx 全链路）
#   · 后端进程 / 内部依赖直连 127.0.0.1（绕过反代，区分“入口挂了”与“进程挂了”）
#   · 外部依赖（GitHub Releases）与证书 / DNS 单独分组
#   · 状态页 UI 每 10 秒自动刷新，公网入口每 30 秒探测一次
# ============================================================================

storage:
  type: sqlite
  path: /opt/gatus/data/gatus.db
  # 30s 间隔下保留 7 天明细（20160 条/端点），驱动 UI 的可用率与响应时间曲线
  maximum-number-of-results: 20160
  maximum-number-of-events: 300

web:
  address: 127.0.0.1
  port: 8080

ui:
  title: CurrentMusic 服务状态
  description: CurrentMusic 各服务的实时可用性监控
  header: CurrentMusic 服务状态
  dashboard-heading: 服务健康总览
  dashboard-subheading: 各端点每 30 秒探测一次，本页每 10 秒自动刷新
  logo: https://music.20110208.xyz/home/assets/favicon.svg
  link: https://music.20110208.xyz/
  dark-mode: true
  default-sort-by: group
  buttons:
    - name: 官网
      link: https://music.20110208.xyz/
    - name: Web 播放器
      link: https://music.20110208.xyz/app/
    - name: API 文档
      link: https://music.20110208.xyz/api-docs/

endpoints:
  # ── 公网入口（Cloudflare → nginx → 静态/后端 全链路）────────────────────
  - name: 官网首页
    group: 公网入口
    url: https://music.20110208.xyz/
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    client:
      timeout: 15s

  - name: Web 播放器（流声屿）
    group: 公网入口
    url: https://music.20110208.xyz/app/
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    client:
      timeout: 15s

  - name: API 文档站
    group: 公网入口
    url: https://music.20110208.xyz/api-docs/
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    client:
      timeout: 15s

  - name: 流声引擎官网
    group: 公网入口
    url: https://music.20110208.xyz/home/engine/
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    client:
      timeout: 15s

  - name: CurrentStation 控制台
    group: 公网入口
    url: https://music.20110208.xyz/station
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    client:
      timeout: 15s

  - name: CurrentDeveloper 平台
    group: 公网入口
    url: https://music.20110208.xyz/developer
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    client:
      timeout: 15s

  - name: 后端健康检查（/cm/health）
    group: 公网入口
    url: https://music.20110208.xyz/cm/health
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
    client:
      timeout: 15s

  - name: 客户端版本接口（/cm/version/latest）
    group: 公网入口
    url: https://music.20110208.xyz/cm/version/latest
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    client:
      timeout: 15s

  - name: APK 下载源（302 跳转）
    group: 公网入口
    url: https://music.20110208.xyz/cm/download/latest
    interval: 60s
    conditions:
      - "[STATUS] == 302"
    client:
      timeout: 15s
      ignore-redirect: true

  - name: NCM CDN 边缘诊断
    group: 公网入口
    url: https://music.20110208.xyz/cm/ncm/song/url/health
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    client:
      timeout: 20s

  - name: 客户端引导配置（/cm/bootstrap）
    group: 公网入口
    url: https://music.20110208.xyz/cm/bootstrap
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    client:
      timeout: 15s

  # ── 后端进程（直连本机，绕过 nginx/Cloudflare）─────────────────────────
  - name: CurrentMusic 后端（127.0.0.1:3010）
    group: 后端进程
    url: http://127.0.0.1:3010/health
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
    client:
      timeout: 5s

  - name: LDDC 歌词桥（127.0.0.1:3015）
    group: 后端进程
    url: http://127.0.0.1:3015/health
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"
    client:
      timeout: 5s

  # ── 内部依赖（TCP 存活：进程在监听即视为可用）──────────────────────────
  - name: NCM API 服务（:3001）
    group: 内部依赖
    url: tcp://127.0.0.1:3001
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    client:
      timeout: 5s

  - name: NCM SVIP 注入代理（:3003）
    group: 内部依赖
    url: tcp://127.0.0.1:3003
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    client:
      timeout: 5s

  - name: QQ 音乐 API（:3200）
    group: 内部依赖
    url: tcp://127.0.0.1:3200
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    client:
      timeout: 5s

  # ── 外部依赖 ────────────────────────────────────────────────────────────
  - name: GitHub Releases（CurrentMusic 主仓库）
    group: 外部依赖
    url: https://github.com/backrooms-yrc/CurrentMusic/releases
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    client:
      timeout: 30s

  - name: GitHub Releases（CurrentMusicX）
    group: 外部依赖
    url: https://github.com/bileizhen/CurrentMusicX/releases
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    client:
      timeout: 30s

  # ── 证书与域名 ──────────────────────────────────────────────────────────
  # Cloudflare 边缘证书剩余有效期（低于 7 天即视为异常，可提前发现轮换失败）
  - name: TLS 证书剩余有效期
    group: 证书与域名
    url: https://music.20110208.xyz
    interval: 1h
    conditions:
      - "[CERTIFICATE_EXPIRATION] > 168h"
    client:
      timeout: 15s

  # 域名 A 记录解析（用公共 DNS 验证解析链路本身）
  - name: 域名 DNS 解析
    group: 证书与域名
    url: 223.5.5.5
    interval: 5m
    dns:
      query-name: music.20110208.xyz
      query-type: A
    conditions:
      - "[DNS_RCODE] == NOERROR"
    client:
      timeout: 10s
