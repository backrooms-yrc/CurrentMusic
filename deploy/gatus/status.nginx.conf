# Include inside each server block that serves /status/.
location = /status { return 302 /status/; }

# Retain the existing public Gatus API.
location ^~ /status/api/v1/ {
    proxy_pass http://127.0.0.1:8080/api/v1/;
}

location ^~ /status/ {
    alias /srv/currentmusic/data/status/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-store" always;
    add_header CDN-Cache-Control "no-store" always;
}
