<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>线路测速 · CurrentMusic</title>
<link rel="icon" href="/app/brand-icon.png?v=sage1" type="image/png"><link rel="apple-touch-icon" href="/app/apple-touch-icon.png?v=sage1">
<style>
:root{color-scheme:light dark;--bg:#f2f4f8;--card:#fff;--fg:#182131;--muted:#657187;--line:#e5e9f1;--blue:#1967d2;--ok:#137f55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Microsoft YaHei",sans-serif}main{max-width:1080px;margin:auto;padding:48px 24px}a{color:var(--blue);text-decoration:none}nav{display:flex;justify-content:space-between;font-size:14px}h1{font-size:clamp(30px,5vw,44px);letter-spacing:-.04em;margin:32px 0 8px}p{color:var(--muted);margin:8px 0}.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:26px 0}button,.enter{border:0;border-radius:14px;background:var(--blue);color:white;padding:12px 20px;font:inherit;cursor:pointer;display:inline-block}button:disabled{opacity:.55;cursor:wait}.secondary{background:var(--card);color:var(--blue);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px}.card.best{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}h2{font-size:20px;margin:0}.tag{font-size:12px;color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent);border-radius:8px;padding:3px 8px}.domain{font-size:13px;overflow-wrap:anywhere;margin:5px 0 22px}.number{font-size:32px;font-weight:700;letter-spacing:-.03em}.label{font-size:13px;color:var(--muted)}.server{border-top:1px solid var(--line);padding-top:12px;margin-top:18px;font-size:13px;color:var(--muted)}.enter{margin-top:18px;font-size:14px;padding:9px 16px}.note{margin-top:28px;font-size:13px}.error{color:#c33}.meta{font-size:13px}footer{margin-top:32px;color:var(--muted);font-size:13px}@media(max-width:640px){main{padding:26px 16px}.grid{grid-template-columns:1fr}.card{padding:20px}}@media(prefers-color-scheme:dark){:root{--bg:#11151d;--card:#1c2330;--fg:#edf2fb;--muted:#a3afc2;--line:#303a4c;--blue:#86b5ff;--ok:#7ed5af}button,.enter{color:#11151d}.secondary{color:var(--blue)}}
</style></head><body><main>
<nav><a href="/app/">← CurrentMusic</a><a href="/api-docs/reference/guide-network-lines-api/">接口文档</a></nav>
<h1>选择更顺畅的线路</h1><p>同一首音乐，多一个顺畅入口。检测当前网络，找到适合你的主站或镜像线路。</p>
<div class="actions"><button id="test">开始测速</button><button id="server" class="secondary">查看服务端测速</button><span id="status" role="status" aria-live="polite" class="meta">点击开始，从你的设备测试全部线路。</span></div>
<div id="cards" class="grid"></div>
<p class="note">本地测速测量浏览器到线路探针的 HTTPS 总耗时，包含连接、TLS 和响应时间，每条线路测两次；结果会受网络和 CDN 缓存影响，不是 TCPing，也不表示下载速度。服务端结果来自服务器所在网络，不能代替你的本地结果。不会自动跳转或携带登录凭据。</p>
<footer>CurrentMusic · 线路状态仅代表本次检测</footer>
</main><script>
'use strict';
const fallback=[['main','主站','https://music.20110208.xyz'],['ctcehs','CTCEHS 镜像','https://music.ctcehs.com'],['geekertao','Geekertao 镜像','https://currentmusic.geekertao.com'],['bileizhen','Bileizhen 镜像','https://cm.bileizhen.top']].map(([id,name,origin])=>({id,name,origin,appUrl:origin+'/app/',probeUrl:origin+'/cm/network/probe'}));
let lines=fallback.map(x=>({...x})),running=false,serverRunning=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){
  const good=lines.filter(x=>x.local&&x.local.ok===2).sort((a,b)=>a.local.ms-b.local.ms),best=good[0];
  $('cards').innerHTML=lines.map(x=>{const r=x.local,s=x.result;return `<article class="card${x===best?' best':''}"><div class="head"><h2>${esc(x.name)}</h2>${x===best?'<span class="tag">本次最快 · 两次成功</span>':''}</div><p class="domain">${esc(x.origin)}</p><div class="label">你的设备 → 此线路</div><div class="number">${!r?'待测速':r.pending?'测速中…':r.ok?Math.round(r.ms)+' ms':'暂不可用'}</div><div class="label">${r&&!r.pending?r.ok+'/2 次成功'+(r.ok===1?' · 连接不稳定':''): 'HTTPS 请求耗时'}</div><a class="enter" href="${esc(x.appUrl)}" rel="noreferrer">进入此线路 ↗</a><div class="server">服务端测速：${s?(s.available?Math.round(s.latencyMs)+' ms · 可用':esc(s.status)+(s.httpStatus?' · HTTP '+s.httpStatus:'')):'尚未查询'}</div></article>`}).join('');
}
async function fetchJson(url,timeout){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);try{const r=await fetch(url,{cache:'no-store',credentials:'omit',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}}
function checkLine(x){return fallback.some(f=>f.id===x.id&&f.origin===x.origin&&f.appUrl===x.appUrl&&f.probeUrl===x.probeUrl)}
async function load(measure){const data=await fetchJson('/cm/network/lines?measure='+measure,7000);if(!Array.isArray(data.lines)||data.lines.length!==fallback.length||!data.lines.every(checkLine)||new Set(data.lines.map(x=>x.id)).size!==fallback.length)throw Error('线路目录格式错误');data.lines.forEach(x=>{if(x.result)lines.find(l=>l.id===x.id).result=x.result});draw();return data}
$('test').onclick=async()=>{if(running)return;running=true;$('test').disabled=true;lines.forEach(x=>x.local={pending:true});draw();$('status').textContent='正在测试全部线路，请稍候…';try{await Promise.all(lines.map(async x=>{const values=[];for(let i=0;i<2;i++){const begin=performance.now();try{const data=await fetchJson(x.probeUrl+'?t='+Date.now()+'-'+i,4500);if(data.ok!==true||data.service!=='CurrentMusic')throw Error('响应内容不正确');values.push(performance.now()-begin)}catch(e){/* 超时、CORS 或业务校验失败均不计成功 */}}x.local={ok:values.length,ms:values.length?values.reduce((a,b)=>a+b,0)/values.length:null};draw()}));$('status').textContent='测速完成 · '+new Date().toLocaleTimeString()+'，可选择两次成功且耗时较低的线路。'}finally{running=false;$('test').disabled=false}};
$('server').onclick=async()=>{if(serverRunning||running)return;serverRunning=true;$('server').disabled=true;try{const d=await load(1);$('status').textContent=d.measuredAt?'服务端测于 '+new Date(d.measuredAt*1000).toLocaleString()+(d.cached?'（缓存）':'')+(d.measuring?' · 正在更新':''):'服务端正在测速，请稍后再次查询。'}catch(e){$('status').textContent='服务端结果暂不可用；仍可使用本地测速。'}finally{serverRunning=false;$('server').disabled=false}};
draw();load(0).catch(()=>{});
</script></body></html>
