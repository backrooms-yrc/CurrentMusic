<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <!-- index.html 本身没有指纹；一旦被 CDN/WebView 缓存，就会引用旧版 app.css/app.js，
       表现成「改了但没生效」。强制每次重新校验入口文件，资源仍走 ?v= 指纹缓存。 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>CurrentMusic 流声屿</title>
  <link rel="icon" href="brand-icon.png?v=sage1" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=sage1">
  <script>
    // 某些 CDN 将 /app 的重定向内部跟随，返回首页却保留无斜杠 URL。
    // 固定网页资源基址，避免 app.js 被解析成站点根目录的 /app.js。
    // Android 的 cm.local 虚拟源仍从 assets 根目录读取。
    if (location.hostname !== 'cm.local' && /^\/app(?:\/|$)/.test(location.pathname)) {
      var cmBase = document.createElement('base');
      cmBase.href = '/app/';
      document.head.appendChild(cmBase);
    }
  </script>
  <!-- UI 预设 + 一次性强制重置：都要在样式表之前落盘/生效，否则会先闪一帧旧皮肤。
       只读 localStorage，出错静默（默认即原样式）。 -->
  <script>
    // ── 一次性强制重置（v1.28.74：全员切换 CurrentMusicX 风格）──────────────
    // 把所有用户的「界面风格」拉到新默认 cmx，并清掉玻璃自定义值（回落皮肤默认）。
    // **只强制一次**：写完 cm.recReset 标记后，用户之后自己改的设置不会再被覆盖；
    // 将来若需要再强制一遍，把 REC 的值改掉即可。
    // 放在这段行内脚本里而不是 bundle 里，是因为它必须早于首帧（否则会先闪一帧旧皮肤）；
    // bundle 侧只根据 window.__cmRecReset 决定是否提示用户。
    var REC = 'rec-1.28.74';
    try {
      if (localStorage.getItem('cm.recReset') !== REC) {
        localStorage.setItem('cm.uiPreset', 'cmx');
        localStorage.removeItem('cm.glassBlur');
        localStorage.removeItem('cm.glassTint');
        localStorage.setItem('cm.recReset', REC);
        window.__cmRecReset = true;   // 这次是全员可见的切换：人人都提示一句怎么改回
      }
    } catch (e) { /* 忽略 */ }
    try {
      var bootTheme = localStorage.getItem('cm.theme') || 'auto';
      var p = localStorage.getItem('cm.uiPreset');
      // 翱翔鸟Music：auto 不跟随系统变深色（首帧也不能闪黑）
      if (p === 'soaringbird' && bootTheme !== 'light' && bootTheme !== 'dark') bootTheme = 'light';
      document.documentElement.classList.add('mdui-theme-' + (bootTheme === 'dark' || bootTheme === 'light' ? bootTheme : 'auto'));
      // 默认皮肤 = CurrentMusicX 风格（v1.28.74 起）：未选择过 → cmx；
      // 显式选了 Material 3 → 不打属性（基础样式）；其余按所存值。
      if (p === 'frost' || p === 'glass' || p === 'cmx' || p === 'soaringbird' || p === 'aimo') document.documentElement.setAttribute('data-ui-preset', p);
      else if (p !== 'md3') document.documentElement.setAttribute('data-ui-preset', 'cmx');
      // 个性化（背景图 / 玻璃效果值）也要在样式表之前打上，否则会先闪一帧默认底色
      var bg = localStorage.getItem('cm.bgImage');
      if (bg) document.documentElement.style.setProperty('--cm-bg-image', 'url("' + bg.replace(/["\\]/g, '\\$&') + '")');
      var gb = parseFloat(localStorage.getItem('cm.glassBlur'));
      if (isFinite(gb)) document.documentElement.style.setProperty('--frs-lens-blur', String(gb));
      var gt = localStorage.getItem('cm.glassTint');
      if (gt !== null && gt !== '') document.documentElement.style.setProperty('--frs-alpha', gt);
    } catch (e) { /* 忽略 */ }
  </script>
  <link rel="stylesheet" href="app.css?v=f878ad8b90">
  <style>
    html, body { margin: 0; height: 100%; overscroll-behavior-y: none; }
    #boot { position: fixed; top: 0; right: 0; bottom: 0; left: 0; inset: 0; z-index: 10000; display: flex;
      align-items: center; justify-content: center; background: #f7f2fa;
      background: rgb(var(--mdui-color-surface, 247, 242, 250)); }
    #boot .cm-loading-indicator { width: 64px; height: 64px; }
    @media (prefers-color-scheme: dark) { #boot { background: #141218; background: rgb(var(--mdui-color-surface, 20, 18, 24)); } }
    html[data-ui-preset="aimo"] #boot { display: none !important; }
  </style>

              '\nUA: ' + ua +
            '</div>' +
            '<div style="margin:16px 0 4px;font-weight:600">可尝试</div>' +
            '<ol style="margin:0;padding-left:20px;font-size:calc(13px * var(--cm-fs, 1));color:#49454f">' +
              '<li>应用商店 / 系统设置里更新「Android System WebView」（或 Chrome）后重开 App</li>' +
              '<li>点击下方「重试」重新加载</li>' +
              '<li>仍失败请把上面的信息截图反馈</li>' +
            '</ol>' +
            '<div style="margin-top:18px;display:flex;gap:10px">' +
              '<button onclick="location.reload()" style="flex:1;height:44px;border:none;border-radius:22px;background:#6750a4;color:#fff;font-size:calc(15px * var(--cm-fs, 1))">重试</button>' +
              '<button id="cmCopyDiag" style="height:44px;padding:0 18px;border-radius:22px;border:1px solid #79747e;background:transparent;font-size:calc(14px * var(--cm-fs, 1))">复制信息</button>' +
            '</div>' +
          '</div>';
        var pre = boot.querySelector('div > div:nth-child(3)');
        var btn = document.getElementById('cmCopyDiag');
        if (btn) btn.onclick = function () {
          try {
            var t = pre ? pre.textContent : detail;
            (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
              function () { btn.textContent = '已复制'; },
              function () { btn.textContent = '请长按选中复制'; }
            );
          } catch (e) { btn.textContent = '请长按选中复制'; }
        };
      }
      window.__cmDiag = show;
      window.addEventListener('error', function (e) {
        if (window.__cmBooted) return;
        if (e.target && e.target.tagName === 'SCRIPT' && e.target.src) {
          show('脚本资源加载失败', '请检查网络或 CDN 资源响应：\n' + e.target.src);
          return;
        }
        if (e.message || e.filename) show('脚本执行错误', (e.message || '') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (window.__cmBooted) return;
        var r = e.reason;
        show('初始化异常', String((r && r.stack) || (r && r.message) || r));
      });
      // 超时兜底：脚本没跑到 boot 完成（解析失败/资源未加载）
      setTimeout(function () {
        if (!window.__cmBooted && !shown) {
          show('加载超时', '应用未能在 9 秒内启动。请检查网络、CDN 返回的脚本资源以及浏览器控制台中的具体错误。');
        }
      }, 9000);
    })();
  </script>
  <script src="app.js?v=f878ad8b90"></script>
</body>
</html>
